<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editor DM8</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-aspnet.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            background-color: #121212;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            padding: 10px;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            gap: 10px;
            padding-bottom: 10px;
            background-color: #121212;
            flex-shrink: 0;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:active {
            background-color: #0284c7;
        }
        .editor-container {
            position: relative;
            flex: 1;
            display: flex;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 8px;
            overflow: hidden;
        }
        .line-numbers {
            width: 45px;
            padding: 12px 5px;
            background-color: #f0f0f0;
            color: #888888;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 19px;
            line-height: 1.5;
            text-align: right;
            user-select: none;
            border-right: 1px solid #e0e0e0;
            overflow: hidden;
            white-space: pre;
            flex-shrink: 0;
        }
        .work-area {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: auto;
        }
        textarea, pre {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            margin: 0;
            border: none;
            font-family: Verdana, Geneva, sans-serif;
            font-size: 19px;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            box-sizing: border-box;
            tab-size: 4;
        }
        textarea {
            z-index: 2;
            color: transparent;
            background: transparent;
            caret-color: #000000;
            resize: none;
            outline: none;
            -webkit-overflow-scrolling: touch;
        }
        pre {
            z-index: 1;
            background: #ffffff !important;
            pointer-events: none;
        }
        code {
            font-family: Verdana, Geneva, sans-serif !important;
            font-size: 19px !important;
            line-height: 1.5 !important;
            padding: 0 !important;
            background: transparent !important;
        }
    </style>
</head>
<body>

    <header>
        <button id="openBtn">📂 Apri</button>
        <button id="saveBtn">💾 Salva</button>
    </header>

    <div class="editor-container">
        <div id="lineNumbers" class="line-numbers">1</div>
        <div class="work-area">
            <pre id="highlighting"><code id="highlighting-content" class="language-plaintext"></code></pre>
            <textarea id="editor" placeholder="Scrivi qui o apri un file..." spellcheck="false"></textarea>
        </div>
    </div>

    <script>
        let fileHandle;
        const editor = document.getElementById('editor');
        const highlightingContent = document.getElementById('highlighting-content');
        const highlighting = document.getElementById('highlighting');
        const lineNumbers = document.getElementById('lineNumbers');

        function updateEditor() {
            let text = editor.value;
            if (text.endsWith("\n")) {
                text += " ";
            }
            highlightingContent.textContent = text;
            Prism.highlightElement(highlightingContent);

            const lines = editor.value.split('\n').length;
            let numbers = '';
            for (let i = 1; i <= lines; i++) {
                numbers += i + '\n';
            }
            lineNumbers.textContent = numbers;
        }

        function syncScroll() {
            highlighting.scrollTop = editor.scrollTop;
            highlighting.scrollLeft = editor.scrollLeft;
            lineNumbers.scrollTop = editor.scrollTop;
        }

        function setLanguage(fileName) {
            const ext = fileName ? fileName.split('.').pop().toLowerCase() : '';
            highlightingContent.className = '';
            if (ext === 'html' || ext === 'htm' || ext === 'asp') {
                highlightingContent.classList.add('language-markup');
            } else if (ext === 'js') {
                highlightingContent.classList.add('language-javascript');
            } else {
                highlightingContent.classList.add('language-plaintext');
            }
        }

        editor.addEventListener('input', updateEditor);
        editor.addEventListener('scroll', syncScroll);

        document.getElementById('openBtn').addEventListener('click', async () => {
            try {
                [fileHandle] = await window.showOpenFilePicker({
                    types: [{
                        description: 'File di testo e codice',
                        accept: {
                            'text/plain': ['.txt', '.html', '.htm', '.js', '.asp']
                        }
                    }]
                });
                const file = await fileHandle.getFile();
                setLanguage(file.name);
                editor.value = await file.text();
                updateEditor();
            } catch (err) {
                console.log('Apertura annullata', err);
            }
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            try {
                if (!fileHandle) {
                    fileHandle = await window.showSaveFilePicker({
                        types: [{
                            description: 'File di testo e codice',
                            accept: {
                                'text/plain': ['.txt', '.html', '.htm', '.js', '.asp']
                            }
                        }]
                    });
                }
                const writable = await fileHandle.createWritable();
                await writable.write(editor.value);
                await writable.close();
                alert('File salvato con successo!');
            } catch (err) {
                console.log('Salvataggio annullato', err);
            }
        });

        updateEditor();
    </script>
</body>
</html>
